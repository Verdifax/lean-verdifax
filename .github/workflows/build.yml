name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan (pinned toolchain from lean-toolchain)
        run: |
          # elan-init.sh at the commit of elan v4.2.4, not a moving branch.
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Axiom audit (no sorry, no ad-hoc axioms, kernel-only trust)
        run: |
          ! grep -rnE "\bsorry\b|\badmit\b|\bnative_decide\b|^[[:space:]]*axiom\b" \
            --include="*.lean" Verdifax.lean Verdifax/

      - name: lake build (kernel-checks all theorems; prints axiom footprint)
        run: lake build
